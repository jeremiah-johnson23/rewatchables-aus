name: Streaming Match Audit

# Runs on pushes to audit/* branches, or manually from the Actions tab.
# Results land on an audit-results-<run id> branch for review before merging.
# Pulls any new episodes, then re-checks every film against JustWatch AU,
# grades match confidence, applies only trusted matches and commits the
# report + data back to the same branch for review before merging.

on:
  push:
    branches: ['audit/**']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Probe JustWatch query support
        run: python -u scripts/audit_streaming_matches.py --ids heat,jaws --dry

      - name: Probe JustWatch latency
        run: |
          for t in Heat Jaws Rocky; do
            curl -s -o /dev/null -w "$t %{http_code} %{time_total}s\n" -X POST https://apis.justwatch.com/graphql \
              -H 'Content-Type: application/json' -H 'User-Agent: Mozilla/5.0' \
              -d '{"query":"query{popularTitles(country:AU,filter:{searchQuery:\"'$t'\"},first:3){edges{node{id}}}}"}'
          done

      - name: Add new episodes
        run: python scripts/add_new_episode.py --count 5

      - name: Enrich metadata
        continue-on-error: true
        run: python scripts/enrich_metadata.py

      - name: Fetch Apple Podcast URLs
        continue-on-error: true
        run: python scripts/fetch_apple_podcast_urls.py

      - name: Streaming for new episodes
        run: python -u scripts/audit_streaming_matches.py --apply --empty

      - name: Audit + apply trusted matches
        run: python -u scripts/audit_streaming_matches.py --apply $( [ -s audit/ids.txt ] && echo --ids $(cat audit/ids.txt) )

      - name: Commit results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/episodes.json audit/
          git diff --staged --quiet || git commit -m "Streaming match audit $(date -u +%F)"
          git push --force origin HEAD:refs/heads/audit-results-${{ github.run_id }}
